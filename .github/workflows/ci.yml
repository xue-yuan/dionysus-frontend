name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc carries the locale key assertions, so a key added to one dictionary
      # and not the other fails here rather than falling back at runtime.
      - run: pnpm exec tsc -b

      - run: pnpm exec vp lint

      - run: pnpm exec vp test --run

      - run: pnpm build
