server {
    listen 80;
    server_name _;
    # Where the contents of dist/ are copied after `pnpm build`.
    root /var/www/dionysus;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints every asset, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API listens on the same host; the browser only ever sees same-origin
    # /api, which is why the client ships no CORS assumptions.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: /recipes and /saved are routes, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
